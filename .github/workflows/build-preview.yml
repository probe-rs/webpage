# This workflow builds the PR code. It has no secrets.
# The "Publish preview on CF Pages" workflow deploys the result.

name: Build preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install & build with Astro
        uses: withastro/action@v6

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: preview
          path: dist/
          retention-days: 1
